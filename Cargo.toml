[package]
name = "satyam-dairy"
version = "0.1.0"
authors = ["narendra <207900392+narendra030207@users.noreply.github.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
